<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">VITESTERTL favicon</title>
  <desc id="desc">Professional Linux server control plane icon with a modern shield and terminal-inspired V symbol.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122033"/>
      <stop offset="50%" stop-color="#1a2a40"/>
      <stop offset="100%" stop-color="#0b1629"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="vStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="42" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M128 22 L204 60 L204 156 L128 234 L52 156 L52 60 Z" fill="url(#panel)" stroke="rgba(148,163,184,0.5)" stroke-width="3"/>
    <path d="M128 42 L188 74 L188 146 L128 214 L68 146 L68 74 Z" fill="none" stroke="rgba(148,163,184,0.28)" stroke-width="2.5"/>

    <g>
      <rect x="75" y="72" width="106" height="14" rx="7" fill="rgba(148,163,184,0.18)"/>
      <circle cx="88" cy="79" r="4.2" fill="#E95420"/>
      <circle cx="101" cy="79" r="4.2" fill="#FBBF24"/>
      <circle cx="114" cy="79" r="4.2" fill="#34D399"/>
    </g>

    <path d="M88 168 L112 102 L128 138 L144 102 L168 168" fill="none" stroke="url(#vStroke)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 150 H151" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g>
    <circle cx="58" cy="64" r="12" fill="#E95420"/>
    <circle cx="200" cy="64" r="12" fill="#A81D33"/>
    <circle cx="58" cy="190" r="12" fill="#2E6BFF"/>
    <circle cx="200" cy="190" r="12" fill="#22C55E"/>
  </g>
</svg>
